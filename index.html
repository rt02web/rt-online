<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>RT ONLINE — RT02/RW29 Gading Elok 1</title>
  <meta name="description" content="Sistem informasi dan administrasi warga RT02/RW29 Perumahan Gading Elok 1, Karawang Wetan: tagihan IPL, pembayaran, surat pengantar, pengumuman, agenda, dan galeri.">
  <meta name="theme-color" content="#033A65">
  <link rel="icon" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=1.2">
</head>
<body>
  <noscript><div style="padding:24px;font-family:sans-serif">RT ONLINE membutuhkan JavaScript. Aktifkan JavaScript pada browser Anda.</div></noscript>
  <div id="app"><div class="loader" style="min-height:100vh"><div class="spin"></div><span>Memuat RT ONLINE…</span></div></div>

  <script>
    /* Bila ada berkas skrip yang rusak / tertukar, tampilkan penyebabnya (bukan layar "Memuat" selamanya) */
    window.addEventListener('error', function (e) {
      var a = document.getElementById('app');
      if (!a || !a.querySelector('.loader') || !e.filename) return;
      a.innerHTML = '<div style="padding:24px;font-family:system-ui,sans-serif;max-width:640px;margin:48px auto;background:#fff;border:1px solid #E2E8F0;border-radius:12px">'
        + '<h2 style="margin:0 0 8px;color:#991B1B">Aplikasi gagal dimuat</h2><p style="margin:0 0 8px">Galat pada berkas <b>' + String(e.filename).split('/').pop().split('?')[0] + '</b> baris ' + (e.lineno || '-') + ':</p>'
        + '<pre style="white-space:pre-wrap;background:#FEF2F2;padding:10px;border-radius:8px">' + String(e.message || '').replace(/</g, '&lt;') + '</pre>'
        + '<p>Pastikan semua berkas di folder <b>js/</b> dan <b>css/</b> berasal dari paket RT ONLINE yang sama, lalu muat ulang dengan Ctrl+Shift+R.</p></div>';
    });
  </script>
  <script src="js/config.js?v=1.2"></script>
  <script src="js/api.js?v=1.2"></script>
  <script src="js/ui.js?v=1.2"></script>
  <script src="js/app.js?v=1.2"></script>
  <script src="js/publik.js?v=1.2"></script>
  <script src="js/panel.js?v=1.2"></script>
  <script src="js/warga.js?v=1.2"></script>
  <script src="js/keuangan.js?v=1.2"></script>
  <script src="js/layanan.js?v=1.2"></script>
  <script src="js/admin.js?v=1.2"></script>
</body>
</html>
